services:
  backend:
    build:
      context: ./office-reservation-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "127.0.0.1:5005:5005"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/office_reservation_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
       db:
         condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./office-reservation-web  # Corrected to use relative path
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8080  # This should point to the backend API
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: office_reservation_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: office_reservation_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
